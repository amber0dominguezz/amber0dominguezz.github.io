<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="utf-8">
	
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

</style>

<head>

</head>

<body>
	<!-- p5.js for WEBGL rendering -->
	<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
	<script>
		let segmentLength = 400;
		let corridorWidth = 600;
		let corridorHeight = 300;
		let speed = 6;
		let distance = 0;
		let pillars = [];
		let pillarSpacing = 80; // base spacing between pillars
		let lastPillarZ = 0; // where last pillar was placed

		function setup() {
			createCanvas(windowWidth, windowHeight, WEBGL);
			pixelDensity(1);
			noSmooth();
			// White surfaces with black lines for structure
			stroke(0);
			strokeWeight(1);
			fill(255);
			noLights();
			// Narrow field of view for tunnel effect
			perspective(PI / 5.0, width / height, 0.1, 10000);
		}

		function windowResized() {
			resizeCanvas(windowWidth, windowHeight);
			perspective(PI / 5.0, width / height, 0.1, 10000);
		}

		function generatePillars() {
			// Generate new pillars ahead of the camera
			while (lastPillarZ < distance + 1000) {
				// Random spacing between pillars
				const randomSpacing = pillarSpacing + random(-30, 30);
				lastPillarZ += randomSpacing;
				
				// Random side (left or right)
				const side = random() < 0.5 ? -1 : 1;
				const x = side * (corridorWidth / 2 + 50); // slightly outside corridor
				
				// Random height variation
				const height = corridorHeight * (0.7 + random(0.3));
				
				pillars.push({
					x: x,
					z: lastPillarZ,
					height: height,
					width: 20 + random(10) // random width
				});
			}
		}

		function drawPillars() {
			// Draw all visible pillars
			for (let pillar of pillars) {
				const relativeZ = pillar.z - distance;
				
				// Only draw if pillar is in view
				if (relativeZ > -100 && relativeZ < 1000) {
					push();
					translate(pillar.x, 0, relativeZ);
					box(pillar.width, pillar.height, pillar.width);
					pop();
				}
			}
			
			// Remove pillars that are behind us
			pillars = pillars.filter(pillar => pillar.z - distance > -500);
		}

		function draw() {
			background(255);

			// Advance forward constantly
			distance += speed;

			// Generate new pillars
			generatePillars();

			// Draw enough segments to cover depth
			const numSegments = 30;
			const startOffset = -2000; // start far ahead

			for (let i = 0; i < numSegments; i++) {
				const z = (i * segmentLength) + (distance % segmentLength) + startOffset;

				// Floor
				push();
				translate(0, corridorHeight / 2, z);
				rotateX(HALF_PI);
				plane(corridorWidth, segmentLength);
				pop();

				// Ceiling
				push();
				translate(0, -corridorHeight / 2, z);
				rotateX(HALF_PI);
				plane(corridorWidth, segmentLength);
				pop();

				// Left wall
				push();
				translate(-corridorWidth / 2, 0, z);
				rotateY(HALF_PI);
				plane(segmentLength, corridorHeight);
				pop();

				// Right wall
				push();
				translate(corridorWidth / 2, 0, z);
				rotateY(HALF_PI);
				plane(segmentLength, corridorHeight);
				pop();
			}

			// Draw pillars
			drawPillars();
		}
	</script>

</body>

</html>
