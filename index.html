<!DOCTYPE html>
<html lang="en">
  <head>
    <title>A Dominguez Portfolio</title>
	<!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="utf-8">
	
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href='https://fonts.googleapis.com/css?family=Baumans' rel='stylesheet'>
<style>
  body {
    font-family: 'Baumans';font-size: 22px;
    color: white; 
    background: url('images/back1.png') no-repeat center center fixed; 
    background-size: cover; 
  }

  /* Fixed sidenav, full height */
  .sidenav {
    height: 100%;
    width: 200px;
    position: fixed;
    z-index: 1;
    top: 0;
    left: 0;
    background-color: #2b0334 !important; /* Force the background color */
    overflow-x: hidden;
    padding-top: 20px;
  }

  /* Style the sidenav links and the dropdown button */
  .sidenav a, .dropdown-btn {
    padding: 6px 8px 6px 16px;
    text-decoration: none;
    font-size: 20px;
    color: #818181;
    display: block;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    outline: none;
  }

  /* On mouse-over */
  .sidenav a:hover, .dropdown-btn:hover {
    color: #f1f1f1;
  }

  .dropdown-btn {
    padding: 6px 8px 6px 16px;
    text-decoration: none;
    font-size: 20px;
    color: #818181;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    outline: none;
  }

  .dropdown-container {
    display: none; /* Hide the dropdown by default */
    background-color: #2b0334; /* Match the sidebar background */
    padding-left: 16px; /* Indent dropdown links */
  }

  .dropdown-container a {
    padding: 6px 8px;
    text-decoration: none;
    font-size: 18px;
    color: #818181;
    display: block;
  }

  .dropdown-container a:hover {
    color: #f1f1f1;
  }

  .dropdown-btn:hover {
    color: #f1f1f1;
  }

  .content {
    margin-top: 30px; /* Add margin to prevent the header from being hidden behind the navbar */
    margin-left: 220px; /* Ensure content does not overlap with the sidebar */
  }

  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* Responsive columns */
    gap: 20px; /* Space between grid items */
    margin-top: 20px; /* Add spacing above the grid */
  }

  .image-grid img {
    width: 100%; /* Make images responsive */
    height: auto; /* Maintain aspect ratio */
    border-radius: 10px; /* Optional: Add rounded corners */
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Optional: Add a shadow */
  }

  .categories {
    margin-top: 20px;
  }

  .category {
    margin-bottom: 40px;
  }

  .category h2 {
    font-size: 24px;
    color: #f1f1f1;
  }

  .image-column {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }

  .image-column img {
    width: 200px;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }
</style>
</head>
<body>
  <div class="container-fluid">
    <!-- Sidebar Navigation -->
    <div class="sidenav">
      <a href="index.html">Home</a>
      <a href="aboutme.htm">Artist Statement</a>
      <a href="mememashup.htm">Contact</a>
    </div>

    <!-- Main Content -->
    <div class="content">
      <h1 class="center-text">Amber Dominguez Penaloza</h1>

      <!-- Categories -->
      <div class="categories">
        <!-- Category 1 -->
        <div class="category">
          <h2>DMA Pieces</h2>
          <div class="image-column">
            <a href="glitch.htm"><img src="images/2.JPG" alt="glitch" width="200" height="150"></a>
            <a href="minecraft.htm"><img src="images/3dprint1.jpeg" alt="minecraft" width="200" height="150"></a>
            <a href="DIYphotoshop.htm"><img src="images/hellokitty.jpg" alt="photoshop" width="200" height="150"></a>
            <a href="mememashup.htm"><img src="images/meme.png" alt="meme" width="200" height="150"></a>
            <a href="finalgame.htm"><img src="images/ball_chase2.jpg" alt="ballgame" width="200" height="150"></a>
          </div>
        </div>

        <!-- Category 2 -->
        <div class="category">
          <h2>Video Pieces</h2>
          <div class="image-column">
            <a href="video.html"><img src="images/video1.jpg" alt="video 1" width="200" height="150"></a>
            <a href="video2.html"><img src="images/video2.jpg" alt="video 2" width="200" height="150"></a>
            <a href="video3.html"><img src="images/video3.jpg" alt="video 3" width="200" height="150"></a>
            <a href="video4.html"><img src="images/video4.jpg" alt="video 4" width="200" height="150"></a>
            <a href="video5.html"><img src="images/video5.jpg" alt="video 5" width="200" height="150"></a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const dropdownBtn = document.querySelector(".dropdown-btn");
      const dropdownContainer = document.querySelector(".dropdown-container");

      dropdownBtn.addEventListener("click", function () {
        // Toggle the visibility of the dropdown container
        dropdownContainer.style.display =
          dropdownContainer.style.display === "block" ? "none" : "block";
      });
    });
  </script>
</body>
</html>
