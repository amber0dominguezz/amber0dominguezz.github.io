<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Game - WASD Movement</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            z-index: 100;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <h3>3D Interactive Game</h3>
            <p>Position: <span id="position">0, 0, 0</span></p>
            <p>Speed: <span id="speed">0</span></p>
        </div>
        
        <div id="instructions">
            <h4>Controls:</h4>
            <p>W/A/S/D - Move around</p>
            <p>Mouse - Look around</p>
            <p>Space - Jump</p>
            <p>Shift - Run</p>
        </div>
        
        <div id="crosshair"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game variables
        let camera, scene, renderer;
        let player;
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = true;
        let isRunning = false;
        
        // Movement variables
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const speed = 0.1;
        const runSpeed = 0.2;
        const jumpHeight = 0.5;
        let isOnGround = true;
        
        // Mouse control variables
        let mouseX = 0;
        let mouseY = 0;
        const sensitivity = 0.002;
        
        init();
        animate();
        
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            
            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('gameContainer').appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Ground
            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x90EE90,
                side: THREE.DoubleSide 
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Create some 3D objects to explore
            createObjects();
            
            // Player (invisible, just for physics)
            const playerGeometry = new THREE.BoxGeometry(1, 2, 1);
            const playerMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xff0000,
                transparent: true,
                opacity: 0.3
            });
            player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.set(0, 1, 0);
            player.castShadow = true;
            scene.add(player);
            
            // Event listeners
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('click', onMouseClick);
            
            // Lock pointer for mouse look
            renderer.domElement.addEventListener('click', function() {
                renderer.domElement.requestPointerLock();
            });
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize);
        }
        
        function createObjects() {
            // Create various 3D objects to explore
            
            // Cube
            const cubeGeometry = new THREE.BoxGeometry(2, 2, 2);
            const cubeMaterial = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
            const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            cube.position.set(5, 1, 0);
            cube.castShadow = true;
            scene.add(cube);
            
            // Sphere
            const sphereGeometry = new THREE.SphereGeometry(1.5, 32, 32);
            const sphereMaterial = new THREE.MeshLambertMaterial({ color: 0xff00ff });
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            sphere.position.set(-5, 1.5, 3);
            sphere.castShadow = true;
            scene.add(sphere);
            
            // Cylinder
            const cylinderGeometry = new THREE.CylinderGeometry(1, 1, 3, 32);
            const cylinderMaterial = new THREE.MeshLambertMaterial({ color: 0x0000ff });
            const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
            cylinder.position.set(0, 1.5, -5);
            cylinder.castShadow = true;
            scene.add(cylinder);
            
            // Torus
            const torusGeometry = new THREE.TorusGeometry(2, 0.5, 16, 100);
            const torusMaterial = new THREE.MeshLambertMaterial({ color: 0xffff00 });
            const torus = new THREE.Mesh(torusGeometry, torusMaterial);
            torus.position.set(8, 2, 8);
            torus.castShadow = true;
            scene.add(torus);
            
            // Tree-like objects
            for (let i = 0; i < 10; i++) {
                const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.5, 3, 8);
                const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.set(
                    (Math.random() - 0.5) * 40,
                    1.5,
                    (Math.random() - 0.5) * 40
                );
                trunk.castShadow = true;
                scene.add(trunk);
                
                const leavesGeometry = new THREE.SphereGeometry(2, 8, 8);
                const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
                const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                leaves.position.copy(trunk.position);
                leaves.position.y += 2.5;
                leaves.castShadow = true;
                scene.add(leaves);
            }
        }
        
        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW':
                    moveForward = true;
                    break;
                case 'KeyS':
                    moveBackward = true;
                    break;
                case 'KeyA':
                    moveLeft = true;
                    break;
                case 'KeyD':
                    moveRight = true;
                    break;
                case 'Space':
                    if (canJump && isOnGround) {
                        velocity.y = jumpHeight;
                        isOnGround = false;
                    }
                    break;
                case 'ShiftLeft':
                case 'ShiftRight':
                    isRunning = true;
                    break;
            }
        }
        
        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW':
                    moveForward = false;
                    break;
                case 'KeyS':
                    moveBackward = false;
                    break;
                case 'KeyA':
                    moveLeft = false;
                    break;
                case 'KeyD':
                    moveRight = false;
                    break;
                case 'ShiftLeft':
                case 'ShiftRight':
                    isRunning = false;
                    break;
            }
        }
        
        function onMouseMove(event) {
            if (document.pointerLockElement === renderer.domElement) {
                mouseX -= event.movementX * sensitivity;
                // Remove vertical mouse movement - only horizontal turning
                // mouseY -= event.movementY * sensitivity;
                
                // Keep vertical rotation fixed at 0 (eye level)
                mouseY = 0;
            }
        }
        
        function onMouseClick(event) {
            // Simple interaction - could be expanded
            console.log('Clicked!');
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Update movement
            const currentSpeed = isRunning ? runSpeed : speed;
            
            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();
            
            if (moveForward || moveBackward) {
                velocity.z -= direction.z * currentSpeed;
            }
            if (moveLeft || moveRight) {
                velocity.x -= direction.x * currentSpeed;
            }
            
            // Apply friction
            velocity.x *= 0.9;
            velocity.z *= 0.9;
            
            // Apply gravity
            if (!isOnGround) {
                velocity.y -= 0.02;
            }
            
            // Update player position
            player.translateZ(velocity.z);
            player.translateX(velocity.x);
            player.position.y += velocity.y;
            
            // Ground collision
            if (player.position.y <= 1) {
                player.position.y = 1;
                velocity.y = 0;
                isOnGround = true;
            }
            
            // Update camera position to follow player
            camera.position.copy(player.position);
            camera.position.y += 1.5; // Eye level
            
            // Apply mouse rotation to camera
            camera.rotation.y = mouseX;
            camera.rotation.x = mouseY;
            
            // Update UI
            document.getElementById('position').textContent = 
                `${player.position.x.toFixed(1)}, ${player.position.y.toFixed(1)}, ${player.position.z.toFixed(1)}`;
            document.getElementById('speed').textContent = 
                `${Math.sqrt(velocity.x * velocity.x + velocity.z * velocity.z).toFixed(2)}`;
            
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
